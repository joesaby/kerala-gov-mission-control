name: Deploy

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  deploy:
    name: Build and deploy to Deno Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build step
        run: deno task build

      - name: Upload to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: kerala-mission-control
          entrypoint: _fresh/server.js
          root: .
