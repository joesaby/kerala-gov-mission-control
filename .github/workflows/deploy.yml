name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check

      - name: Test
        run: deno task test

      - name: Malayalam glyph check
        run: deno task check:ml

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Trust VM host key
        run: ssh-keyscan -H 35.222.232.148 >> ~/.ssh/known_hosts

      - name: Deploy to GCP VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: deno task deploy
