name: CI

# PR/push verification only. Production deploy is `.github/workflows/deploy.yml`
# (GCP VM over SSH) — see docs/specs/hosting-and-ops.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type check
        run: deno check

      - name: Test
        run: deno task test

      - name: Malayalam glyph check
        run: deno task check:ml

      - name: Build
        run: deno task build
