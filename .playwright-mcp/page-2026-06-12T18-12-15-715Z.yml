        - generic [ref=e142]:
            - heading "The way forward" [level=2] [ref=e143]
            - paragraph [ref=e144]: How Kerala can come out of this — the report's own prescription. Belt-tightening has limits; the durable fix is growth.
            - paragraph [ref=e145]: These are advisory recommendations, not the government's manifesto promises. We track each one's adoption as Government Orders give evidence of action.
            - generic [ref=e146]:
                - paragraph [ref=e147]: Do now
                - generic [ref=e148]:
                    - generic [ref=e149]:
                        - generic [ref=e150]:
                            - heading "Bring KIIFB back under budgetary control" [level=3] [ref=e151]
                            - generic [ref=e152]: Do now
                        - paragraph [ref=e153]: Place KIIFB under the administrative and Finance Department budget, subject it to an immediate C&AG performance audit, and take an early call on its future — while retaining genuinely useful units like the Institutional Finance Group (for local-body bonds) and the KIIFCON consultancy.
                        - generic [ref=e154]:
                            - generic [ref=e156]: Order issued
                            - link "evidence ↗" [ref=e157] [cursor=pointer]:
                                - /url: /gov/orders/go.2026-fin-42
                    - generic [ref=e158]:
                        - generic [ref=e159]:
                            - heading "Rein in committed expenditure" [level=3] [ref=e160]
                            - generic [ref=e161]: Do now
                        - paragraph [ref=e162]: With about 80% of resources going to salaries, pensions and interest, hard political choices are due. Raising the retirement age saves roughly ₹6,000 cr (~$627.1M) for every year of increase, and pay commissions could move to a ten-year cycle, as in the Centre.
                        - generic [ref=e165]: Not yet acted on
                    - generic [ref=e166]:
                        - generic [ref=e167]:
                            - heading "Modernise how government runs" [level=3] [ref=e168]
                            - generic [ref=e169]: Do now
                        - paragraph [ref=e170]: Restructure the State Planning Board as a think-tank and project monitor, introduce performance management linked to the budget, move welfare pensions to Aadhaar-linked direct benefit transfer, complete real digitalisation within a fixed window, and coordinate with peer states to reopen Centre–State fiscal dialogue.
                        - generic [ref=e173]: Not yet acted on
            - generic [ref=e174]:
                - paragraph [ref=e175]: Structural reform
                - generic [ref=e176]:
                    - generic [ref=e177]:
                        - generic [ref=e178]:
                            - heading "Grow the economy — don't just cut" [level=3] [ref=e179]
                            - generic [ref=e180]: Structural reform
                        - paragraph [ref=e181]: "There is a limit to how far belt-tightening can go. The durable fix is growth: resolutely encourage private and cooperative investment, let local governments raise funds from the market (outside off-budget limits), and open the power sector to private investment so sunrise sectors have plentiful power."
                        - generic [ref=e184]: Not yet acted on
                    - generic [ref=e185]:
                        - generic [ref=e186]:
                            - heading "Turn around or exit loss-making PSEs" [level=3] [ref=e187]
                            - generic [ref=e188]: Structural reform
                        - paragraph [ref=e189]: Commission studies to make KSEBL, KWA and KSRTC efficient (Tamil Nadu's transport revamp is a model), give utility chiefs 3–5 year tenures, wind up chronic loss-makers, monetise unused assets, and allow private participation in the rest. Shift from production-based to consumption-based subsidies.
                        - generic [ref=e192]: Not yet acted on
                    - generic [ref=e193]:
                        - generic [ref=e194]:
                            - heading "Create jobs for educated youth" [level=3] [ref=e195]
                            - generic [ref=e196]: Structural reform
                        - paragraph [ref=e197]: Reform land and labour laws, build reasonably priced industrial infrastructure, expand IT/AI services and tourism, strengthen the coastal economy, and open access to private and foreign universities — making higher education the next hub of Kerala's growth.
                        - generic [ref=e200]: Not yet acted on
                    - generic [ref=e201]:
                        - generic [ref=e202]:
                            - heading "Put the cooperative sector to work" [level=3] [ref=e203]
                            - generic [ref=e204]: Structural reform
                        - paragraph [ref=e205]: "Channel the cooperative engine into productive activity: primary agricultural credit societies hold a credit base of about ₹1.3 lakh crore (~$13.59B) and the Kerala Bank a comparable volume of business — deployable through local governments for employment-generating investment."
