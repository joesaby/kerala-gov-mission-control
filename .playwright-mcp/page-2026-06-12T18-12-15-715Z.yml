        - heading "Kerala's Fiscal Health 2026 — A Status Report" [level=1] [ref=e37]
        - paragraph [ref=e38]: The new government's fiscal baseline, tabled before the 16th Kerala Legislative Assembly
        - paragraph [ref=e39]: Tabled 1 June 2026·Finance Department, Government of Kerala
        - paragraph [ref=e40]: Published at the start of the government's term, this report is a candid, evidence-based picture of what Kerala truly receives, spends and owes — a look behind the veil of the annual budget. It is a documented baseline the Legislature, media and public can measure the next five years against. Kerala's social achievements remain exceptional; the challenge is whether the State's finances can sustain them.
